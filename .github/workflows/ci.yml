name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build backend/HRPortal.Api.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hr-portal .
      - name: Smoke test (salud, SPA, login y Swagger)
        run: |
          docker run -d --name app -p 8080:8080 -e Jwt__Key=ci-only-key-with-at-least-32-characters hr-portal
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 2; done
          curl -fs localhost:8080/ | grep -qi '<div id="root"'
          curl -fs localhost:8080/employees | grep -qi '<div id="root"'
          curl -fs localhost:8080/swagger/v1/swagger.json | grep -q '"/api/auth/login"'
          curl -fs -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"ceo","password":"Admin2025!"}' | grep -q '"token"'
      - name: Auditoría de la API (roles, permisos y datos)
        run: python3 .github/scripts/api_audit.py
      - name: Logs del contenedor
        if: always()
        run: docker logs app 2>&1 | grep -E "fail:|Exception|error" | head -40 || true
