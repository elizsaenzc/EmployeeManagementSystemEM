<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HR Portal — ESC Media & Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root{
  --brand:#1E3A5F;
  --brand2:#2563EB;
  --brand-light:#EFF6FF;
  --accent:#10B981;
  --accent2:#F59E0B;
  --danger:#EF4444;
  --warn:#F97316;
  --surface:#F8FAFC;
  --surface2:#F1F5F9;
  --border:#E2E8F0;
  --border2:#CBD5E1;
  --text:#0F172A;
  --text2:#475569;
  --text3:#94A3B8;
  --white:#FFFFFF;
  --sidebar-w:260px;
  --topbar-h:60px;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
  --font:'Plus Jakarta Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font);background:var(--surface);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:var(--font);border:none;outline:none}
input,select,textarea{font-family:var(--font);outline:none}
a{text-decoration:none;color:inherit}
ul{list-style:none}
img{max-width:100%}

/* ═══════════════════════════════════════════════
   LOGIN PAGE
═══════════════════════════════════════════════ */
#login-page{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 50%,#1e4080 100%);
  position:relative;overflow:hidden;
}
#login-page::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(37,99,235,.15) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(16,185,129,.08) 0%,transparent 50%);
}
.login-card{
  background:var(--white);border-radius:20px;
  padding:40px;width:420px;max-width:95vw;
  box-shadow:0 25px 50px rgba(0,0,0,.4);
  position:relative;z-index:1;
}
.login-logo{
  display:flex;align-items:center;gap:12px;margin-bottom:32px;
}
.login-logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.login-logo-text{font-size:18px;font-weight:800;color:var(--brand)}
.login-logo-sub{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.5px}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px;letter-spacing:.3px}
.form-input{
  width:100%;border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;font-size:14px;color:var(--text);
  transition:border-color .2s,box-shadow .2s;background:var(--surface);
}
.form-input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,99,235,.12);background:var(--white)}
.btn-login{
  width:100%;padding:12px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:var(--white);font-weight:700;font-size:14px;
  letter-spacing:.3px;transition:opacity .2s,transform .1s;
  margin-top:8px;
}
.btn-login:hover{opacity:.92}
.btn-login:active{transform:scale(.99)}
.login-error{
  background:#FEF2F2;border:1px solid #FECACA;color:var(--danger);
  border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none;
}
.demo-accounts{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}
.demo-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{
  background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;text-align:left;transition:all .2s;
}
.demo-btn:hover{border-color:var(--brand2);background:var(--brand-light)}
.demo-btn-role{font-size:10px;font-weight:700;color:var(--brand2);letter-spacing:.5px;text-transform:uppercase}
.demo-btn-name{font-size:12px;font-weight:600;color:var(--text);margin-top:1px}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
#app{display:none;height:100vh;overflow:hidden}
.app-layout{display:flex;height:100%}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--brand);
  display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;position:relative;
}
.sidebar-logo{
  padding:20px 20px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.sidebar-logo-text{font-size:15px;font-weight:800;color:var(--white)}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:500}

.sidebar-user{
  padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.sidebar-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand2),#60A5FA);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--white);flex-shrink:0;
}
.sidebar-user-name{font-size:13px;font-weight:700;color:var(--white);line-height:1.2}
.sidebar-user-role{font-size:11px;color:rgba(255,255,255,.5);font-weight:500;margin-top:1px}

.sidebar-nav{padding:12px 0;flex:1}
.nav-section{margin-bottom:4px}
.nav-section-label{
  font-size:10px;font-weight:700;color:rgba(255,255,255,.35);
  letter-spacing:.8px;text-transform:uppercase;
  padding:8px 20px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 20px;cursor:pointer;
  transition:background .15s,color .15s;
  color:rgba(255,255,255,.65);font-size:13px;font-weight:500;
  border-left:3px solid transparent;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white)}
.nav-item.active{
  background:rgba(255,255,255,.12);color:var(--white);font-weight:600;
  border-left-color:var(--brand2);
}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--danger);color:var(--white);
  font-size:10px;font-weight:700;border-radius:100px;
  padding:1px 6px;min-width:18px;text-align:center;
}

.sidebar-footer{
  padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);
}
.btn-logout{
  width:100%;padding:9px;border-radius:8px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s,color .2s;
}
.btn-logout:hover{background:rgba(239,68,68,.2);color:#FCA5A5}

/* MAIN AREA */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:var(--topbar-h);background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 28px;
  gap:16px;flex-shrink:0;
}
.topbar-title{font-size:17px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:12px;color:var(--text3);font-weight:500;margin-left:auto}
.topbar-badge{
  background:var(--brand-light);color:var(--brand2);
  font-size:11px;font-weight:700;border-radius:100px;
  padding:3px 10px;border:1px solid rgba(37,99,235,.2);
}

.page-content{flex:1;overflow-y:auto;padding:28px}

/* ═══════════════════════════════════════════════
   COMPONENTS — CARDS, BUTTONS, BADGES, TABLES
═══════════════════════════════════════════════ */
.card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);padding:24px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text3)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.kpi{
  background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);
  padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:4px;
  border-radius:0 var(--radius-lg) var(--radius-lg) 0;
}
.kpi.blue::after{background:var(--brand2)}
.kpi.green::after{background:var(--accent)}
.kpi.amber::after{background:var(--accent2)}
.kpi.red::after{background:var(--danger)}
.kpi-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:800;color:var(--text);line-height:1;font-family:var(--mono)}
.kpi-desc{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-icon{font-size:28px;position:absolute;right:20px;top:50%;transform:translateY(-50%);opacity:.12}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;
  transition:all .15s;cursor:pointer;
}
.btn-primary{background:var(--brand2);color:var(--white)}
.btn-primary:hover{background:#1D4ED8}
.btn-secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border);color:var(--text)}
.btn-success{background:var(--accent);color:var(--white)}
.btn-success:hover{opacity:.88}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.88}
.btn-warn{background:var(--accent2);color:var(--white)}
.btn-warn:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{padding:5px 10px;font-size:12px;gap:4px}
.btn-xs{padding:3px 8px;font-size:11px;gap:3px;border-radius:6px}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700}
.badge-blue{background:#DBEAFE;color:#1D4ED8}
.badge-green{background:#D1FAE5;color:#065F46}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-gray{background:var(--surface2);color:var(--text2)}
.badge-purple{background:#EDE9FE;color:#5B21B6}
.badge-indigo{background:#E0E7FF;color:#3730A3}

table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface)}
td{padding:12px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface)}

.table-wrap{border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;background:var(--white);box-shadow:var(--shadow)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.section-title{font-size:15px;font-weight:700;color:var(--text)}

.page-grid{display:grid;gap:20px}
.col-2{grid-template-columns:1fr 1fr}
.col-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.col-2,.col-3{grid-template-columns:1fr}}

/* ═══════════════════════════════════════════════
   RESPONSIVE — MOBILE & TABLET
═══════════════════════════════════════════════ */

/* Hamburger button (hidden on desktop) */
.hamburger{
  display:none;
  align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  background:transparent;border:none;cursor:pointer;
  color:var(--text);flex-shrink:0;
  transition:background .15s;
}
.hamburger:hover{background:var(--surface2)}

/* Sidebar overlay backdrop */
.sidebar-backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  z-index:199;
  backdrop-filter:blur(2px);
}
.sidebar-backdrop.open{display:block}

@media(max-width:768px){
  /* ── App layout ── */
  .app-layout{position:relative}

  /* Sidebar becomes fixed overlay */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;
    z-index:200;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:none;
  }
  .sidebar.open{
    transform:translateX(0);
    box-shadow:4px 0 24px rgba(0,0,0,.25);
  }

  /* Main area takes full width */
  .main-area{width:100%}

  /* Topbar mobile */
  .topbar{
    padding:0 16px;
    position:sticky;top:0;z-index:100;
  }
  .hamburger{display:flex}
  .topbar-sub{display:none}

  /* Page content padding */
  .page-content{padding:16px}

  /* KPI grid — 2 cols on mobile */
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .kpi-value{font-size:22px}
  .kpi-icon{display:none}

  /* Dashboard main grid → stack */
  .dash-grid{grid-template-columns:1fr !important}

  /* Login card */
  .login-card{padding:28px 20px;border-radius:16px}
  .demo-grid{grid-template-columns:1fr 1fr}

  /* Tables — make scrollable */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:520px}

  /* Cards padding */
  .card{padding:16px}

  /* Schedule — 7 cols collapse to 4+scroll */
  .schedule-grid{
    grid-template-columns:repeat(4,1fr);
    overflow-x:auto;
  }
  .sched-day{min-width:60px}

  /* Chat layout — mobile: show list OR thread */
  .chat-layout{
    grid-template-columns:1fr;
    height:calc(100vh - var(--topbar-h) - 100px);
  }
  .chat-list{
    display:block;
    border-right:none;
    border-bottom:1px solid var(--border);
    max-height:220px;
    overflow-y:auto;
  }
  .chat-list.hidden{display:none}
  .chat-main.hidden{display:none}
  .chat-back{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;border-bottom:1px solid var(--border);
    font-size:13px;font-weight:600;color:var(--brand2);
    cursor:pointer;background:var(--brand-light);
  }

  /* Email layout — stack */
  .email-layout{
    grid-template-columns:1fr;
    height:auto;
    min-height:400px;
  }
  .email-sidebar{
    border-right:none;
    border-bottom:1px solid var(--border);
    display:flex;gap:4px;padding:10px;
    overflow-x:auto;
  }
  .email-folder{
    white-space:nowrap;padding:6px 10px;font-size:12px;flex-shrink:0;
  }
  .email-list{
    max-height:280px;
    border-right:none;
    border-bottom:1px solid var(--border);
  }
  .email-detail-body{max-height:300px;overflow-y:auto}

  /* Modals */
  .modal-box{padding:20px;width:95vw;max-height:88vh}
  .field-row{grid-template-columns:1fr}

  /* Section headers */
  .section-header{flex-wrap:wrap;gap:8px}

  /* Topbar badge hidden on small screens */
  .topbar-badge{display:none}

  /* Buttons in tables — smaller */
  .btn-xs{padding:3px 6px;font-size:11px}

  /* Team cards grid */
  .team-grid{grid-template-columns:1fr 1fr !important}
}

@media(max-width:480px){
  /* KPI grid single column on very small */
  .kpi-grid{grid-template-columns:1fr}

  /* Schedule scroll */
  .schedule-grid{
    grid-template-columns:repeat(7,72px);
    overflow-x:auto;padding-bottom:8px;
  }

  /* Demo account buttons */
  .demo-grid{grid-template-columns:1fr}

  /* Team grid single column */
  .team-grid{grid-template-columns:1fr !important}

  /* Page content extra tight */
  .page-content{padding:12px}
  .card{padding:14px}

  /* Attendance time display */
  .att-time{font-size:22px !important}
}

/* Progress bars */
.progress-bar{height:6px;background:var(--surface2);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;border-radius:100px;transition:width .6s ease}
.progress-blue{background:var(--brand2)}
.progress-green{background:var(--accent)}
.progress-amber{background:var(--accent2)}
.progress-red{background:var(--danger)}

/* Avatar */
.avatar{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;font-weight:700;color:var(--white);flex-shrink:0;
}
.avatar-sm{width:32px;height:32px;font-size:12px}
.avatar-md{width:40px;height:40px;font-size:14px}
.avatar-lg{width:48px;height:48px;font-size:16px}
.av-blue{background:linear-gradient(135deg,#2563EB,#60A5FA)}
.av-green{background:linear-gradient(135deg,#059669,#34D399)}
.av-purple{background:linear-gradient(135deg,#7C3AED,#A78BFA)}
.av-amber{background:linear-gradient(135deg,#D97706,#FCD34D)}
.av-red{background:linear-gradient(135deg,#DC2626,#F87171)}
.av-indigo{background:linear-gradient(135deg,#4338CA,#818CF8)}
.av-teal{background:linear-gradient(135deg,#0D9488,#2DD4BF)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:8px 16px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--brand2);border-bottom-color:var(--brand2)}

/* Form in modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;z-index:1000;
  backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--white);border-radius:var(--radius-lg);
  padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:modal-in .2s ease;
}
@keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.modal-close{font-size:20px;color:var(--text3);cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;border-top:1px solid var(--border);padding-top:16px}

.field{margin-bottom:16px}
.field-label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
.field-input{
  width:100%;border:1.5px solid var(--border);border-radius:8px;
  padding:9px 12px;font-size:13px;color:var(--text);background:var(--surface);
  transition:border-color .2s;
}
.field-input:focus{border-color:var(--brand2);background:var(--white)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--text);color:var(--white);border-radius:10px;
  padding:12px 18px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);min-width:240px;
  display:flex;align-items:center;gap:10px;
  animation:toast-in .25s ease;
}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.success{background:#065F46;color:#D1FAE5}
.toast.error{background:#991B1B;color:#FEE2E2}
.toast.warn{background:#92400E;color:#FEF3C7}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px;font-weight:500}

/* CHAT */
.chat-layout{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - var(--topbar-h) - 56px);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;background:var(--white);box-shadow:var(--shadow)}
.chat-list{border-right:1px solid var(--border);overflow-y:auto}
.chat-list-header{padding:16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.chat-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;display:flex;gap:10px}
.chat-item:hover,.chat-item.active{background:var(--brand-light)}
.chat-item-name{font-size:13px;font-weight:600;color:var(--text)}
.chat-item-preview{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item-time{font-size:10px;color:var(--text3);flex-shrink:0;margin-left:auto;padding-top:2px}
.chat-main{display:flex;flex-direction:column}
.chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:68%;display:flex;flex-direction:column;gap:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start}
.msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.mine .msg-bubble{background:var(--brand2);color:var(--white);border-bottom-right-radius:4px}
.msg.other .msg-bubble{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
.msg-meta{font-size:10px;color:var(--text3)}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;resize:none}
.chat-input:focus{border-color:var(--brand2)}

/* EMAIL */
.email-layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - var(--topbar-h) - 56px);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;background:var(--white);box-shadow:var(--shadow)}
.email-sidebar{border-right:1px solid var(--border);padding:16px 12px}
.email-folder{padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s}
.email-folder:hover,.email-folder.active{background:var(--brand-light);color:var(--brand2);font-weight:600}
.email-list{border-right:1px solid var(--border);overflow-y:auto}
.email-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.email-item:hover,.email-item.active{background:var(--brand-light)}
.email-item-from{font-size:13px;font-weight:700;color:var(--text)}
.email-item-subject{font-size:12px;color:var(--text2);margin-top:2px}
.email-item-preview{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.email-detail{display:flex;flex-direction:column}
.email-detail-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.email-detail-subject{font-size:17px;font-weight:700;margin-bottom:8px}
.email-detail-meta{font-size:12px;color:var(--text3);display:flex;gap:16px;flex-wrap:wrap}
.email-detail-body{padding:24px;font-size:14px;line-height:1.7;color:var(--text2);flex:1}

/* SCHEDULE */
.schedule-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.sched-day{background:var(--surface);border-radius:10px;padding:12px;border:1px solid var(--border);text-align:center;min-height:90px}
.sched-day.today{border-color:var(--brand2);background:var(--brand-light)}
.sched-day-name{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.sched-day-num{font-size:20px;font-weight:800;margin:4px 0;color:var(--text)}
.sched-day.today .sched-day-num{color:var(--brand2)}
.sched-shift{font-size:10px;background:var(--brand2);color:var(--white);border-radius:4px;padding:2px 6px;margin-top:4px;display:inline-block;font-weight:600}

/* PERFORMANCE SCORE */
.score-circle{
  width:80px;height:80px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;font-family:var(--mono);
  border:4px solid;flex-shrink:0;
}
.score-excellent{color:#059669;border-color:#D1FAE5;background:#F0FDF4}
.score-good{color:var(--brand2);border-color:#DBEAFE;background:#EFF6FF}
.score-average{color:var(--accent2);border-color:#FEF3C7;background:#FFFBEB}

/* PAYROLL */
.payslip-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.payslip-row:last-child{border-bottom:none}
.payslip-label{color:var(--text2)}
.payslip-val{font-weight:600;font-family:var(--mono)}
.payslip-total{font-size:15px;font-weight:800;color:var(--accent)}

/* STATUS INDICATORS */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot-green{background:var(--accent)}
.dot-amber{background:var(--accent2)}
.dot-red{background:var(--danger)}
.dot-blue{background:var(--brand2)}
.dot-gray{background:var(--text3)}
</style>
</head>

function doLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  doAuth(u,p);
}
function quickLogin(u,p){
  document.getElementById('inp-user').value=u;
  document.getElementById('inp-pass').value=p;
  doAuth(u,p);
}
function doAuth(u,p){
  const acc=ACCOUNTS[u];
  const err=document.getElementById('login-error');
  if(!acc||acc.pass!==p){err.style.display='block';return;}
  err.style.display='none';
  const emp=MOCK.employees.find(e=>e.id===acc.empId);
  SESSION={user:u,emp,role:emp.rol};
  // check today attendance
  const todayRec=MOCK.attendance.find(a=>a.empId===emp.id&&a.fecha===today());
  if(todayRec){todayCheckedIn=true;todayCheckedOut=!!todayRec.salida;}
  document.getElementById('login-page').style.display='none';
  document.getElementById('app').style.display='block';
  setupShell();
  navigate('dashboard');
}
function doLogout(){
  SESSION={user:null,emp:null,role:null};
  document.getElementById('app').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('inp-user').value='';
  document.getElementById('inp-pass').value='';
}

═══════════════════════════════════════════════════════════════ */
function rAtt(){
  const emp=SESSION.emp,r=SESSION.role;
  const isMgr=['Coordinator','HR','Admin'].includes(r);
  const todayRec=MOCK.attendance.find(a=>a.empId===emp.id&&a.fecha===today());
  const history=MOCK.attendance.filter(a=>a.empId===emp.id&&a.fecha!==today()).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  const now=new Date();
  const timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

  let todayCard=`<div class="card" style="margin-bottom:20px">
    <div class="section-header"><div><div class="card-title">Registro de Hoy — ${fmtDate(today())}</div></div></div>
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="text-align:center;min-width:110px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Entrada</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);color:${todayRec?'var(--brand2)':'var(--text3)'}">${todayRec?todayRec.entrada:'—'}</div>
      </div>
      <div style="text-align:center;min-width:110px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Salida</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);color:${todayRec&&todayRec.salida?'var(--accent)':'var(--text3)'}">${todayRec&&todayRec.salida?todayRec.salida:'—'}</div>
      </div>
      <div style="text-align:center;min-width:110px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Horas</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);color:var(--text)">${todayRec&&todayRec.horas?todayRec.horas+'h':'—'}</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">
        ${!todayCheckedIn?`<button class="btn btn-success" onclick="chkIn()"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;flex-shrink:0;vertical-align:middle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Registrar Entrada</button>`:''}
        ${todayCheckedIn&&!todayCheckedOut?`<button class="btn btn-warn" onclick="chkOut()"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;flex-shrink:0;vertical-align:middle"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Registrar Salida</button>`:''}
        ${todayCheckedOut?`<span class="badge badge-green" style="padding:8px 16px;font-size:13px"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;flex-shrink:0;vertical-align:middle"><polyline points="20 6 9 17 4 12"/></svg> Jornada completa</span>`:''}
      </div>
    </div>
  </div>`;

  let histHtml=`<div class="card"><div class="section-header"><div class="card-title">Historial de Jornada</div><span style="font-size:12px;color:var(--text3)">Últimos registros</span></div>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Tipo</th><th>Horas</th><th>Estado</th></tr></thead><tbody>`;
  history.forEach(a=>{
    histHtml+=`<tr><td>${fmtDate(a.fecha)}</td><td><span style="font-family:var(--mono)">${a.entrada}</span></td><td><span style="font-family:var(--mono)">${a.salida||'—'}</span></td><td>${a.tipo}</td><td><span style="font-family:var(--mono)">${a.horas?a.horas+'h':'—'}</span></td><td>${statusBadge(a.estado)}</td></tr>`;
  });
  histHtml+='</tbody></table></div></div>';

  let teamHtml='';
  if(isMgr){
    const todayAll=MOCK.attendance.filter(a=>a.fecha===today());
    teamHtml=`<div class="card" style="margin-top:20px"><div class="section-header"><div class="card-title">Asistencia del equipo hoy</div></div>
      <div class="table-wrap"><table><thead><tr><th>Empleado</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead><tbody>`;
    todayAll.forEach(a=>{
      const e=getEmp(a.empId);
      if(e.id)teamHtml+=`<tr><td><div style="display:flex;align-items:center;gap:8px">${avatar(e,'sm')}<span>${e.nombreCompleto}</span></div></td><td><span style="font-family:var(--mono)">${a.entrada}</span></td><td><span style="font-family:var(--mono)">${a.salida||'—'}</span></td><td>${statusBadge(a.estado)}</td></tr>`;
    });
    teamHtml+='</tbody></table></div></div>';
  }

  return todayCard+histHtml+teamHtml;
}

function chkIn(){
  if(todayCheckedIn){toast('Ya tienes entrada registrada hoy','warn');return;}
  const now=new Date();
  const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  MOCK.attendance.unshift({id:99,empId:SESSION.emp.id,fecha:today(),entrada:t,salida:null,tipo:'Presencial',estado:'En curso',horas:null});
  todayCheckedIn=true;
  toast('Entrada registrada a las '+t,'success');
  navigate('attendance');
}
function chkOut(){
  if(!todayCheckedIn){toast('Primero debes registrar la entrada','warn');return;}
  if(todayCheckedOut){toast('Ya tienes salida registrada hoy','warn');return;}
  const now=new Date();
  const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const rec=MOCK.attendance.find(a=>a.empId===SESSION.emp.id&&a.fecha===today());
  if(rec){rec.salida=t;rec.estado='Completado';rec.horas=8.5;}
  todayCheckedOut=true;
  toast('Salida registrada a las '+t,'success');
  navigate('attendance');
}

      ${isHR?`<td><div style="display:flex;align-items:center;gap:8px">${avatar(e,'sm')}<div><div style="font-weight:600">${e.nombreCompleto}</div><div style="font-size:11px;color:var(--text3)">${e.departamento}</div></div></div></td>`:''}

function subLeave(){

  MOCK.leaves.push({id:Date.now(),empId:SESSION.emp.id,tipo,inicio:ini,fin,dias:d,motivo:mot,estado:'Pendiente',solicitada:today()});

function approveLeave(id){

/* ═══════════════════════════════════════════════════════════════
   PERFORMANCE
═══════════════════════════════════════════════════════════════ */
function rPerf(){
  const emp=SESSION.emp,r=SESSION.role;
  const isHR=['HR','Admin'].includes(r);
  const isMgr=['Coordinator','HR','Admin'].includes(r);
  const myPerf=isHR?MOCK.performance:MOCK.performance.filter(p=>p.empId===emp.id);

  const scoreClass=s=>s>=90?'score-excellent':s>=80?'score-good':'score-average';
  const scoreLabel=s=>s>=90?'Excelente':s>=80?'Muy Bueno':s>=70?'Bueno':'A mejorar';

  let cards='';
  myPerf.sort((a,b)=>b.id-a.id).forEach(p=>{
    const e=getEmp(p.empId);
    const cls=scoreClass(p.puntuacion);
    cards+=`<div class="card">
      <div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:16px">
        <div class="score-circle ${cls}">${p.puntuacion}</div>
        <div>
          ${isHR?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">${avatar(e,'sm')}<span style="font-weight:600">${e.nombreCompleto}</span></div>`:''}
          <div class="card-title">${p.periodo}</div>
          <div class="card-sub">Evaluado por ${p.evaluador} · ${fmtDate(p.fecha)}</div>
          <span class="badge ${cls==='score-excellent'?'badge-green':cls==='score-good'?'badge-blue':'badge-amber'}" style="margin-top:6px">${scoreLabel(p.puntuacion)}</span>
        </div>
      </div>
      <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill ${cls==='score-excellent'?'progress-green':cls==='score-good'?'progress-blue':'progress-amber'}" style="width:${p.puntuacion}%"></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div><div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Objetivos</div><div style="font-size:12px;color:var(--text2);line-height:1.5">${p.objetivos}</div></div>
        <div><div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Logros</div><div style="font-size:12px;color:var(--text2);line-height:1.5">${p.logros}</div></div>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Áreas de mejora</div>
        <div style="font-size:12px;color:var(--text2)">${p.areasMejora}</div>
      </div>
      ${isMgr?`<div style="margin-top:12px;text-align:right"><button class="btn btn-ghost btn-sm" onclick="openPerfModal(${p.empId})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;flex-shrink:0;vertical-align:middle"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar evaluación</button></div>`:''}
    </div>`;
  });

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div>
      ${myPerf.length?`<div style="font-size:13px;color:var(--text2)">Promedio: <strong style="font-family:var(--mono);font-size:16px;color:var(--brand2)">${(myPerf.reduce((s,p)=>s+p.puntuacion,0)/myPerf.length).toFixed(1)}</strong> / 100</div>`:''}
    </div>
    ${isMgr?`<button class="btn btn-primary" onclick="openPerfModal(0)">+ Nueva evaluación</button>`:''}
  </div>
  ${cards||`<div class="empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div><div class="empty-text">Sin evaluaciones registradas</div></div>`}`;
}

function openPerfModal(empId){
  const emps=MOCK.employees.filter(e=>e.rol!=='Admin');
  showModal(`<div class="modal-title">Nueva Evaluación de Rendimiento <span class="modal-close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></div>

      <select class="field-input" id="pf-emp">${emps.map(e=>`<option value="${e.id}" ${e.id===empId?'selected':''}>${e.nombreCompleto} — ${e.departamento}</option>`).join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">Período</label><select class="field-input" id="pf-per"><option>Q1 2025</option><option selected>Q2 2025</option><option>Q3 2025</option></select></div>
      <div class="field"><label class="field-label">Puntuación (0-100)</label><input type="number" class="field-input" id="pf-score" min="0" max="100" value="85"/></div>

    <div class="field"><label class="field-label">Objetivos planteados</label><textarea class="field-input" id="pf-obj" rows="2" placeholder="Describe los objetivos del período..."></textarea></div>
    <div class="field"><label class="field-label">Logros alcanzados</label><textarea class="field-input" id="pf-log" rows="2" placeholder="Describe los logros del período..."></textarea></div>
    <div class="field"><label class="field-label">Áreas de mejora</label><textarea class="field-input" id="pf-am" rows="2" placeholder="Indica las áreas de mejora..."></textarea></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="subPerf()">Guardar evaluación</button></div>`);
}

function subPerf(){
  const eId=parseInt(document.getElementById('pf-emp').value);
  const per=document.getElementById('pf-per').value;
  const score=parseInt(document.getElementById('pf-score').value);
  const obj=document.getElementById('pf-obj').value.trim();
  const log=document.getElementById('pf-log').value.trim();
  const am=document.getElementById('pf-am').value.trim();
  if(!obj||!log||!am){toast('Completa todos los campos','warn');return;}
  const cal=score>=90?'Excelente':score>=80?'Muy Bueno':score>=70?'Bueno':'A mejorar';
  MOCK.performance.push({id:Date.now(),empId:eId,periodo:per,puntuacion:score,calificacion:cal,objetivos:obj,logros:log,areasMejora:am,evaluador:SESSION.emp.nombreCompleto,fecha:today()});
  closeModal();toast('Evaluación guardada','success');navigate('performance');
}

        <button class="btn btn-secondary btn-xs" onclick="openEmpModal(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;flex-shrink:0;vertical-align:middle"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar</button>
        ${isAdmin&&e.id!==SESSION.emp.id?`<button class="btn btn-danger btn-xs" onclick="delEmp(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>`:''}
      </td>
    </tr>`;
  });

  return `
  <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="openEmpModal(0)">+ Nuevo empleado</button>
    <input class="field-input" style="width:220px" placeholder="Buscar empleado..." oninput="filterEmps(this.value)"/>
    <span class="badge badge-blue" style="padding:6px 12px">${MOCK.employees.length} empleados</span>
  </div>
  <div class="table-wrap" id="emp-table">
    <table><thead><tr><th>Empleado</th><th>Departamento</th><th>Cargo</th><th>Rol</th><th>Salario</th><th>Incorporación</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody id="emp-tbody">${rows}</tbody></table>
  </div>`;
}

function filterEmps(q){
  const rows=document.querySelectorAll('#emp-tbody tr');
  rows.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';});
}

function viewEmp(id){
  const e=MOCK.employees.find(x=>x.id===id);
  const myPerf=MOCK.performance.filter(p=>p.empId===id);
  const lastP=myPerf.sort((a,b)=>b.id-a.id)[0];
  const myPayroll=MOCK.payroll.filter(p=>p.empId===id).sort((a,b)=>b.id-a.id)[0];
  showModal(`<div class="modal-title">Perfil de Empleado <span class="modal-close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></div>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--surface);border-radius:10px">
      <div class="avatar avatar-lg ${e.avc}">${e.av}</div>
      <div><div style="font-size:17px;font-weight:700">${e.nombreCompleto}</div><div style="font-size:13px;color:var(--text2)">${e.cargo} · ${e.departamento}</div><div style="margin-top:6px">${roleBadge(e.rol)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
      <div class="payslip-row"><span class="payslip-label">Email</span></div><div class="payslip-row"><span style="font-weight:500">${e.email}</span></div>
      <div class="payslip-row"><span class="payslip-label">Teléfono</span></div><div class="payslip-row"><span style="font-weight:500">${e.telefono}</span></div>
      <div class="payslip-row"><span class="payslip-label">Incorporación</span></div><div class="payslip-row"><span style="font-weight:500">${fmtDate(e.fechaIngreso)}</span></div>
      <div class="payslip-row"><span class="payslip-label">Salario bruto</span></div><div class="payslip-row"><span style="font-weight:700;font-family:var(--mono);color:var(--accent)">${fmtMoney(e.salario)}/mes</span></div>
      ${lastP?`<div class="payslip-row"><span class="payslip-label">Último rendimiento</span></div><div class="payslip-row"><span style="font-family:var(--mono);font-weight:700">${lastP.puntuacion}/100 — ${lastP.periodo}</span></div>`:''}
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" onclick="closeModal();openEmpModal(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;flex-shrink:0;vertical-align:middle"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar</button></div>`);
}

function openEmpModal(id){
  const e=id?MOCK.employees.find(x=>x.id===id):{};
  const depts=['Dirección','Tecnología','Marketing','Ventas','Finanzas','RRHH','Operaciones'];
  const roles=['Employee','Coordinator','HR','Admin'];
  showModal(`<div class="modal-title">${id?'Editar Empleado':'Nuevo Empleado'} <span class="modal-close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></div>
    <div class="field-row">
      <div class="field"><label class="field-label">Nombre</label><input class="field-input" id="em-nom" value="${e.nombre||''}"/></div>
      <div class="field"><label class="field-label">Apellidos</label><input class="field-input" id="em-ape" value="${e.apellidos||''}"/></div>
    </div>
    <div class="field"><label class="field-label">Email</label><input class="field-input" id="em-email" type="email" value="${e.email||''}"/></div>
    <div class="field-row">
      <div class="field"><label class="field-label">Departamento</label><select class="field-input" id="em-dep">${depts.map(d=>`<option ${e.departamento===d?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Rol</label><select class="field-input" id="em-rol">${roles.map(r=>`<option ${e.rol===r?'selected':''}>${r}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">Cargo</label><input class="field-input" id="em-cargo" value="${e.cargo||''}"/></div>
      <div class="field"><label class="field-label">Salario (€/mes)</label><input class="field-input" id="em-sal" type="number" value="${e.salario||3000}"/></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="subEmp(${id||0})">${id?'Guardar cambios':'Crear empleado'}</button></div>`);
}

function subEmp(id){
  const nom=document.getElementById('em-nom').value.trim();
  const ape=document.getElementById('em-ape').value.trim();
  const email=document.getElementById('em-email').value.trim();
  const dep=document.getElementById('em-dep').value;
  const rol=document.getElementById('em-rol').value;
  const cargo=document.getElementById('em-cargo').value.trim();
  const sal=parseFloat(document.getElementById('em-sal').value);
  if(!nom||!ape||!email||!cargo){toast('Completa todos los campos','warn');return;}
  const avColors=['av-blue','av-green','av-purple','av-amber','av-red','av-indigo','av-teal'];
  if(id){
    const e=MOCK.employees.find(x=>x.id===id);
    if(e){Object.assign(e,{nombre:nom,apellidos:ape,nombreCompleto:nom+' '+ape,email,departamento:dep,rol,cargo,salario:sal});}
    toast('Empleado actualizado','success');
  }else{
    const av=(nom[0]+ape[0]).toUpperCase();
    MOCK.employees.push({id:Date.now(),username:nom.toLowerCase()+'.'+ape.split(' ')[0].toLowerCase(),nombre:nom,apellidos:ape,nombreCompleto:nom+' '+ape,email,telefono:'',departamento:dep,cargo,rol,salario:sal,fechaIngreso:today(),estado:'Activo',av,avc:avColors[Math.floor(Math.random()*avColors.length)]});
    toast('Empleado creado correctamente','success');
  }
  closeModal();navigate('employees');
}

function delEmp(id){
  if(!confirm('¿Eliminar este empleado?'))return;
  const i=MOCK.employees.findIndex(e=>e.id===id);
  if(i>-1){MOCK.employees.splice(i,1);toast('Empleado eliminado','warn');navigate('employees');}
}

/* ═══════════════════════════════════════════════════════════════
   PAYROLL (HR/Admin)
═══════════════════════════════════════════════════════════════ */
function rPayroll(){
  const pendientes=MOCK.payroll.filter(p=>p.estado==='Pendiente');
  const pagadas=MOCK.payroll.filter(p=>p.estado==='Pagado');
  const totalPend=pendientes.reduce((s,p)=>s+p.neto,0);
  const totalPag=pagadas.reduce((s,p)=>s+p.neto,0);

  let rows='';
  MOCK.payroll.sort((a,b)=>b.id-a.id).forEach(p=>{
    const e=getEmp(p.empId);
    rows+=`<tr>
      <td><div style="display:flex;align-items:center;gap:8px">${avatar(e,'sm')}<div><div style="font-weight:600">${e.nombreCompleto}</div><div style="font-size:11px;color:var(--text3)">${e.departamento}</div></div></div></td>
      <td>${p.periodo}</td>
      <td><span style="font-family:var(--mono)">${fmtMoney(p.bruto)}</span></td>
      <td><span style="font-family:var(--mono);color:var(--danger)">-${fmtMoney(p.ss+p.irpf)}</span></td>
      <td><span style="font-family:var(--mono);font-weight:700;color:var(--accent)">${fmtMoney(p.neto)}</span></td>
      <td>${statusBadge(p.estado)}</td>
      <td>${p.estado==='Pendiente'?`<button class="btn btn-success btn-xs" onclick="markPaid(${p.id})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;flex-shrink:0;vertical-align:middle"><polyline points="20 6 9 17 4 12"/></svg> Pagar</button>`:`<span style="font-size:11px;color:var(--text3)">${fmtDate(p.fecha)}</span>`}</td>
    </tr>`;
  });

  return `
  <div class="kpi-grid" style="margin-bottom:20px">
    <div class="kpi amber"><div class="kpi-label">Pendiente de pago</div><div class="kpi-value" style="font-size:20px">${fmtMoney(totalPend)}</div><div class="kpi-desc">${pendientes.length} nóminas pendientes</div></div>
    <div class="kpi green"><div class="kpi-label">Pagado este mes</div><div class="kpi-value" style="font-size:20px">${fmtMoney(totalPag)}</div><div class="kpi-desc">${pagadas.length} nóminas pagadas</div></div>
    <div class="kpi blue"><div class="kpi-label">Total plantilla</div><div class="kpi-value" style="font-size:20px">${fmtMoney(totalPend+totalPag)}</div><div class="kpi-desc">Coste neto mensual</div></div>
  </div>
  ${pendientes.length?`<div style="display:flex;gap:10px;margin-bottom:16px"><button class="btn btn-success" onclick="payAll()"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;flex-shrink:0;vertical-align:middle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Pagar todas las pendientes</button><span class="badge badge-amber" style="padding:6px 12px">${pendientes.length} pendientes</span></div>`:''}
  <div class="table-wrap">
    <table><thead><tr><th>Empleado</th><th>Período</th><th>Bruto</th><th>Descuentos</th><th>Neto</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

function markPaid(id){
  const p=MOCK.payroll.find(x=>x.id===id);
  if(p){p.estado='Pagado';toast('Nómina marcada como pagada','success');navigate('payroll');}
}
function payAll(){
  MOCK.payroll.filter(p=>p.estado==='Pendiente').forEach(p=>p.estado='Pagado');
  toast('Todas las nóminas procesadas','success');navigate('payroll');
}

/* ═══════════════════════════════════════════════════════════════
   REPORTS
═══════════════════════════════════════════════════════════════ */
function rReports(){
  const depts={};
  MOCK.employees.forEach(e=>{depts[e.departamento]=(depts[e.departamento]||0)+1;});
  const costeDept={};
  MOCK.employees.forEach(e=>{costeDept[e.departamento]=(costeDept[e.departamento]||0)+e.salario;});
  const totalSalario=MOCK.employees.reduce((s,e)=>s+e.salario,0);
  const avgPerf=MOCK.performance.reduce((s,p)=>s+p.puntuacion,0)/MOCK.performance.length;

  let deptRows='';
  Object.entries(depts).sort((a,b)=>b[1]-a[1]).forEach(([d,n])=>{
    deptRows+=`<tr><td>${d}</td><td><span style="font-family:var(--mono)">${n}</span></td><td><span style="font-family:var(--mono)">${fmtMoney(costeDept[d])}/mes</span></td><td><div class="progress-bar" style="width:120px"><div class="progress-fill progress-blue" style="width:${(n/MOCK.employees.length)*100}%"></div></div></td></tr>`;

  <div class="kpi-grid" style="margin-bottom:24px">

    <div class="kpi green"><div class="kpi-label">Coste salarial</div><div class="kpi-value" style="font-size:22px">${fmtMoney(totalSalario)}</div><div class="kpi-desc">Bruto mensual</div></div>

/* ═══════════════════════════════════════════════════════════════

    const myPerf=MOCK.performance.filter(p=>p.empId===e.id);

        <div class="avatar avatar-md ${e.avc}">${e.av}</div>

        <div style="display:flex;justify-content:space-between"><span style="color:var(--text3)">Hoy</span><span>${todayA?statusBadge(todayA.estado):`<span class="badge badge-gray">Sin registro</span>`}</span></div>
        ${lastP?`<div style="display:flex;justify-content:space-between"><span style="color:var(--text3)">Rendimiento</span><span style="font-weight:700;font-family:var(--mono);color:${lastP.puntuacion>=90?'var(--accent)':'var(--brand2)'}">${lastP.puntuacion}/100</span></div>`:''}
      </div>
      <div style="margin-top:12px;display:flex;gap:6px">

        ${['HR','Admin'].includes(SESSION.role)?`<button class="btn btn-ghost btn-xs" onclick="openPerfModal(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;flex-shrink:0;vertical-align:middle"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> Eval.</button>`:''}

let activeFolder='inbox', activeEmailId=null;

function rEmail(){
  const folders=[
    {id:'inbox',icon:`<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,label:'Bandeja de entrada',count:MOCK.emails.filter(e=>e.folder==='inbox'&&!e.leido).length},

  const listHtml=emailList.length?emailList.map(e=>`

  const sel=activeEmailId?MOCK.emails.find(e=>e.id===activeEmailId):null;

        <div class="email-detail-subject">${sel.asunto}</div>
        <div class="email-detail-meta">
          <span>De: ${sel.de}</span>

          <span>${fmtDate(sel.fecha)}</span>

          <button class="btn btn-secondary btn-sm" onclick="toggleStar(${sel.id})">${sel.estrella?'<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;color:var(--accent2);flex-shrink:0;vertical-align:middle"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" stroke="none"/></svg> Destacado':'<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;flex-shrink:0;vertical-align:middle"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Destacar'}</button>
        </div>
      </div>
      <div class="email-detail-body">${sel.cuerpo.replace(/\n/g,'<br/>')}</div>
    </div>`:'<div class="empty" style="margin:auto"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg></div><div class="empty-text">Selecciona un mensaje</div></div>';

    <button class="btn btn-primary btn-sm" onclick="openComposeModal()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;flex-shrink:0;vertical-align:middle"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Redactar</button>

}

function bindEmail(){}

function setFolder(f){activeFolder=f;activeEmailId=null;navigate('email');}

function selectEmail(id){
  activeEmailId=id;
  const e=MOCK.emails.find(x=>x.id===id);
  if(e)e.leido=true;
  navigate('email');
}

function toggleStar(id){
  const e=MOCK.emails.find(x=>x.id===id);
  if(e){e.estrella=!e.estrella;navigate('email');}
}

function replyEmail(id){
  const e=MOCK.emails.find(x=>x.id===id);
  if(!e)return;
  const destino=e.de.match(/<(.+)>/)?e.de.match(/<(.+)>/)[1]:e.de;
  openComposeModal(destino,'Re: '+e.asunto);
}

function openComposeModal(to='',subj=''){
  showModal(`<div class="modal-title">Redactar mensaje <span class="modal-close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></div>
    <div class="field"><label class="field-label">Para</label><input class="field-input" id="em-to" value="${to}" placeholder="correo@escmedia.es"/></div>
    <div class="field"><label class="field-label">Asunto</label><input class="field-input" id="em-subj" value="${subj}" placeholder="Asunto del mensaje"/></div>
    <div class="field"><label class="field-label">Mensaje</label><textarea class="field-input" id="em-body" rows="6" placeholder="Escribe tu mensaje..."></textarea></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="sendEmail()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;flex-shrink:0;vertical-align:middle"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar</button></div>`);
}

function sendEmail(){
  const to=document.getElementById('em-to').value.trim();
  const subj=document.getElementById('em-subj').value.trim();
  const body=document.getElementById('em-body').value.trim();
  if(!to||!subj||!body){toast('Completa todos los campos','warn');return;}
  MOCK.emails.push({id:Date.now(),de:'Yo',para:to,asunto:subj,cuerpo:body,fecha:today(),leido:true,estrella:false,folder:'sent'});
  closeModal();toast('Mensaje enviado correctamente','success');activeFolder='sent';navigate('email');
}

/* ═══════════════════════════════════════════════════════════════
   CHAT
═══════════════════════════════════════════════════════════════ */
let activeChatContactId=null;

function rChat(){
  const emp=SESSION.emp;
  // Contacts = all employees except me
  const contacts=MOCK.employees.filter(e=>e.id!==emp.id);

  const contactList=contacts.map(c=>{
    const thread=MOCK.chat.find(t=>t.contactId===c.id);
    const last=thread?thread.msgs[thread.msgs.length-1]:null;
    return `<div class="chat-item${activeChatContactId===c.id?' active':''}" onclick="openChat(${c.id})">
      <div class="avatar avatar-sm ${c.avc}">${c.av}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between">
          <div class="chat-item-name">${c.nombreCompleto}</div>
          ${last?`<div class="chat-item-time">${last.hora}</div>`:''}
        </div>
        <div class="chat-item-preview">${last?last.texto:'Inicia una conversación'}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:1px">${c.cargo}</div>
      </div>
    </div>`;
  }).join('');

  let msgArea='<div class="empty" style="margin:auto"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="empty-text">Selecciona un contacto</div></div>';

  if(activeChatContactId){
    const contact=MOCK.employees.find(e=>e.id===activeChatContactId);
    const thread=MOCK.chat.find(t=>t.contactId===activeChatContactId);
    const msgs=thread?thread.msgs:[];
    const msgsHtml=msgs.map(m=>`
      <div class="msg ${m.de==='me'?'mine':'other'}">
        <div class="msg-bubble">${m.texto}</div>
        <div class="msg-meta">${m.hora}</div>
      </div>`).join('');

    msgArea=`
      <div class="chat-back" onclick="closeChatThread()" style="display:none" id="chat-back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Volver a contactos
      </div>
      <div class="chat-header">
        <div class="avatar avatar-sm ${contact.avc}">${contact.av}</div>
        <div>
          <div style="font-size:13px;font-weight:700">${contact.nombreCompleto}</div>
          <div style="font-size:11px;color:var(--text3)">${contact.cargo} · ${contact.departamento}</div>
        </div>
        <span class="badge badge-green" style="margin-left:auto"><span class="status-dot dot-green"></span>En línea</span>
      </div>
      <div class="chat-messages" id="chat-msgs">${msgsHtml}</div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg();}"></textarea>
        <button class="btn btn-primary" onclick="sendChatMsg()">Enviar</button>
      </div>`;
  }

  return `<div class="chat-layout">
    <div class="chat-list">
      <div class="chat-list-header"><div style="display:flex;align-items:center;gap:7px"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Mensajes</div></div>
      ${contactList}
    </div>
    <div class="chat-main" id="chat-main-panel">${msgArea}</div>
  </div>`;
}

function bindChat(){
  const msgs=document.getElementById('chat-msgs');
  if(msgs)msgs.scrollTop=msgs.scrollHeight;
  // Mobile: show/hide back button and panels
  const isMobile=window.innerWidth<=768;
  const backBtn=document.getElementById('chat-back-btn');
  const chatList=document.querySelector('.chat-list');
  if(isMobile&&activeChatContactId){
    if(backBtn)backBtn.style.display='flex';
    if(chatList)chatList.classList.add('hidden');
  }else{
    if(backBtn)backBtn.style.display='none';
    if(chatList)chatList.classList.remove('hidden');
  }
}

function closeChatThread(){
  activeChatContactId=null;
  navigate('chat');
}

function openChat(contactId){
  activeChatContactId=contactId;
  // Create thread if not exists
  if(!MOCK.chat.find(t=>t.contactId===contactId)){
    MOCK.chat.push({contactId,msgs:[]});
  }
  navigate('chat');
}

function sendChatMsg(){
  const inp=document.getElementById('chat-input');
  if(!inp)return;
  const txt=inp.value.trim();
  if(!txt)return;
  const now=new Date();
  const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const thread=MOCK.chat.find(t=>t.contactId===activeChatContactId);
  if(thread){
    thread.msgs.push({de:'me',texto:txt,hora:t});
    inp.value='';
    navigate('chat');
    // Simulate reply after 2s
    const contact=MOCK.employees.find(e=>e.id===activeChatContactId);
    const replies=[
      'Entendido, gracias por el aviso.',
      'Perfecto, lo reviso ahora mismo.',
      'De acuerdo.',
      'Recibido. Te confirmo en breve.',
      'Vale, sin problema.',
      'Gracias, lo tengo en cuenta.',
    ];
    setTimeout(()=>{
      const th2=MOCK.chat.find(t=>t.contactId===activeChatContactId);
      if(th2){
        const now2=new Date();
        const t2=now2.getHours().toString().padStart(2,'0')+':'+now2.getMinutes().toString().padStart(2,'0');
        th2.msgs.push({de:'other',texto:replies[Math.floor(Math.random()*replies.length)],hora:t2});
        if(STATE.page==='chat')navigate('chat');
      }
    },2000);
  }
}

function showModal(html){
  document.getElementById('modal-box').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function toast(msg,type='success'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${type==='success'?`<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`:type==='warn'?`<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`:`<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`}</span> ${msg}`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(12px)';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},3000);
}

function toggleSidebar(){

  document.body.style.overflow=open?'hidden':'';

  const bd=document.getElementById('sidebar-backdrop');
  sb.classList.remove('open');

}

// Touch swipe: swipe left to close sidebar
let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const sb=document.getElementById('sidebar');
  if(sb.classList.contains('open')&&dx<-60)closeSidebar();
  if(!sb.classList.contains('open')&&touchStartX<20&&dx>60&&window.innerWidth<=768)toggleSidebar();
},{passive:true});
</script>
</body>
</html>
